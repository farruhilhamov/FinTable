{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Переоценка — FinTable{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <h2 class="mb-3">Новая переоценка: {{ security.name }}</h2>
  <form method="post">{% csrf_token %}
    {{ form|crispy }}
    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit">Сохранить</button>
      <a href="{% url 'security_valuations' security.id %}" class="btn btn-secondary">Отмена</a>
    </div>
  </form>
</div></div>
{% endblock %}
