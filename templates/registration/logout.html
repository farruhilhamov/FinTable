{% extends "base.html" %}
{% block title %}Выход{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:80vh">
  <div class="col-11 col-sm-8 col-md-5 col-lg-4 text-center">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="mb-2">Выйти?</h3>
        <p class="text-muted small mb-4">Вы выйдете из аккаунта {{ user.email }}</p>
        <form method="post">{% csrf_token %}
          <button class="btn btn-danger w-100 mb-2" type="submit">Выйти</button>
          <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary w-100">Отмена</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
