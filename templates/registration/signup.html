{% extends "base.html" %}
{% block title %}Регистрация — FinTable{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-4">
  <h3 class="mb-3">Регистрация</h3>
  <form method="post">{% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" required value="{{ form.email.value|default:'' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Пароль</label>
      <input type="password" name="password1" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Пароль (повтор)</label>
      <input type="password" name="password2" class="form-control" required>
    </div>
    {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors|join:", " }}</div>{% endif %}
    <button class="btn btn-primary w-100" type="submit">Зарегистрироваться</button>
  </form>
  <p class="mt-3 text-center"><a href="{% url 'login' %}">Уже есть аккаунт? Войти</a></p>
</div></div>
{% endblock %}
