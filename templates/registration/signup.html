{% extends "base.html" %}
{% block title %}Регистрация — FinTable{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:80vh">
  <div class="col-11 col-sm-8 col-md-5 col-lg-4">
    <div class="text-center mb-4">
      <div class="nm-brand-logo mx-auto mb-3" style="width:64px;height:64px;font-size:1.8rem">◒</div>
      <h3 class="mb-0">FinTable</h3>
      <p class="text-muted small">личный учёт финансов</p>
    </div>
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form method="post">{% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required value="{{ form.email.value|default:'' }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Пароль</label>
            <input type="password" name="password1" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Пароль (повтор)</label>
            <input type="password" name="password2" class="form-control" required>
          </div>
          {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors|join:", " }}</div>{% endif %}
          <button class="btn btn-primary w-100" type="submit">Зарегистрироваться</button>
        </form>
        <p class="mt-3 text-center mb-0"><a href="{% url 'login' %}">Уже есть аккаунт? Войти</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
