{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 text-center">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h3 class="mb-2">Удалить?</h3>
      <p class="text-muted mb-4">{{ object }}</p>
      <form method="post">{% csrf_token %}
        <button class="btn btn-danger w-100 mb-2" type="submit">Удалить</button>
        <a href="javascript:history.back()" class="btn btn-outline-secondary w-100">Отмена</a>
      </form>
    </div>
  </div>
</div></div>
{% endblock %}
